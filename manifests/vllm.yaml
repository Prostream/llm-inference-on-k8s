apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: llm-inference
    app.kubernetes.io/component: inference-server
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the GPU is an exclusive, indivisible
  # resource, so the replacement pod cannot be scheduled while the
  # incumbent still holds it. Tradeoff: the update window is a full
  # cold start (~165s) with zero availability.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Kubernetes injects legacy Docker-link env vars (<SERVICE>_PORT,
      # <SERVICE>_SERVICE_HOST) for every existing Service. vLLM reads a
      # variable of its own named VLLM_PORT and expects an integer, so a
      # Service named "vllm" made the engine fail at startup. Modern
      # service discovery is DNS; these vars are dead weight.
      enableServiceLinks: false
      # A streaming generation can run for tens of seconds; the 30s
      # default is not enough to drain in-flight requests.
      terminationGracePeriodSeconds: 60
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        args:
          - --model
          - Qwen/Qwen2.5-1.5B-Instruct
          # 0.80 rather than the 0.90 default: the Windows desktop
          # compositor holds ~0.9 GiB of the 12 GiB permanently.
          - --gpu-memory-utilization
          - "0.80"
          - --max-model-len
          - "4096"
        env:
        # The V2 model runner (default since 0.26.0) allocates UVA
        # buffers, which WSL2's CUDA layer does not expose. The V1
        # runner is still present, just no longer the default.
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "0"
        ports:
        - name: http
          containerPort: 8000
        # requests == limits puts the pod in the Guaranteed QoS class.
        # Extended resources like nvidia.com/gpu do not count toward QoS,
        # so declaring the GPU alone would leave a pod with a 165s
        # restart cost sitting in the lowest eviction tier.
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
        # Measured startup is ~163s. The startupProbe grants a 300s
        # budget and suppresses liveness/readiness until it succeeds;
        # once it does, it never runs again and hands over immediately.
        # This is why it is not the same as a large initialDelaySeconds:
        # the handover is driven by startup actually completing, not by
        # a clock, so a genuine hang during startup is still caught and
        # a different model size does not require re-guessing.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        # Controls traffic, not lifecycle: drop out of the Service
        # endpoints the moment we cannot serve.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 1
        # Controls lifecycle, not traffic. Can be aggressive now that
        # startup is handled separately: death is detected within 30s.
        # No initialDelaySeconds — the startupProbe covers that window.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
      volumes:
      # Node-local weight cache. Not production-grade: hostPath pins the
      # pod to one node. A pre-warmed PVC or a cache DaemonSet is the
      # real answer, and it directly attacks the startup latency that
      # makes autoscaling unworkable.
      - name: hf-cache
        hostPath:
          path: /home/liucz/.cache/huggingface
          type: DirectoryOrCreate
      # vLLM uses shared memory between processes; the 64MB Docker
      # default is not enough.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
