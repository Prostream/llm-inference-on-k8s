apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: llm-inference
    app.kubernetes.io/component: inference-server
spec:
  replicas: 1
  # This lab allocates its only GPU exclusively. Recreate releases it
  # before replacement, accepting unavailability during startup.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Kubernetes injects legacy Docker-link env vars (<SERVICE>_PORT,
      # <SERVICE>_SERVICE_HOST) for every existing Service. vLLM reads a
      # variable of its own named VLLM_PORT and expects an integer, so a
      # Service named "vllm" made the engine fail at startup. Modern
      # service discovery is DNS; these vars are dead weight.
      enableServiceLinks: false
      # Experimental termination budget; safe stream draining is not verified.
      terminationGracePeriodSeconds: 60
      containers:
      - name: vllm
        image: vllm/vllm-openai@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
        imagePullPolicy: IfNotPresent
        args:
          - --model
          - Qwen/Qwen2.5-1.5B-Instruct
          - --revision
          - 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          - --tokenizer-revision
          - 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          # Leave headroom for desktop GPU use; measure actual free memory.
          - --gpu-memory-utilization
          - "0.80"
          - --max-model-len
          - "4096"
        env:
        # Historical WSL workaround; verify behavior in the pinned image.
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "0"
        ports:
        - name: http
          containerPort: 8000
        # requests == limits puts the pod in the Guaranteed QoS class.
        # Extended resources like nvidia.com/gpu do not count toward QoS,
        # so declaring the GPU alone would leave a pod with a 165s
        # restart cost sitting in the lowest eviction tier.
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
        # Approximate 300s startup budget, based on historical observations.
        # Re-evaluate for a new model/environment; 400s would exceed it.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        # Controls traffic eligibility after probe and endpoint propagation.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 1
        # Runtime health after startup. Actual restart time also includes
        # probe scheduling, timeout and termination handling.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
      volumes:
      # Machine-specific node-local cache; hostPath does not pin placement.
      # A multi-node deployment would need an explicit distribution strategy.
      - name: hf-cache
        hostPath:
          path: /home/liucz/.cache/huggingface
          type: DirectoryOrCreate
      # vLLM uses shared memory between processes; the 64MB Docker
      # default is not enough.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
