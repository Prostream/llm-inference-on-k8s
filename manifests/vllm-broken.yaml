# Deliberate probe-failure experiment. Uses the SAME Deployment name as
# vllm.yaml and replaces its probe configuration. Apply only in this lab;
# restore with manifests/vllm.yaml after collecting events and previous logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: llm-inference
    app.kubernetes.io/component: inference-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: vllm
        image: vllm/vllm-openai@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
        imagePullPolicy: IfNotPresent
        args:
          - --model
          - Qwen/Qwen2.5-1.5B-Instruct
          - --revision
          - 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          - --tokenizer-revision
          - 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          - --gpu-memory-utilization
          - "0.80"
          - --max-model-len
          - "4096"
        env:
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "0"
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 1
        # DELIBERATELY MISCONFIGURED — see docs/build-log.md Phase 3.
        # Can fail during slow initialization. Capture actual event times;
        # do not infer the exact kill time from delay + threshold * period.
        # Restore the startupProbe configuration after the experiment.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: hf-cache
        hostPath:
          path: /home/liucz/.cache/huggingface
          type: DirectoryOrCreate
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
